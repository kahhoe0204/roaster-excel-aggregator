<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Configured docs</title>
  <link rel="icon" href="/static/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;700&family=IBM+Plex+Sans:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div class="top">
    <h1>Configured Docs</h1>
    <div>
      <a href="/codes" class="btn">Codes</a>
      <a href="/" class="btn">Report</a>
      <a href="/logout" class="btn">Sign out</a>
    </div>
  </div>
  <hr class="roast-rule container">

  <div class="container">
    <div style="display:flex; justify-content:space-between; align-items:baseline; margin-bottom:.75rem;">
      <h2 style="margin:0;">Docs</h2>
      <button type="button" id="sync-btn" class="btn" onclick="syncNow()">Sync now</button>
    </div>
    <p id="sync-status" class="ledger-empty" style="display:none;"></p>
    {% if docs %}
      <div class="table-wrap">
        <table class="ledger">
          <thead><tr><th>Label</th><th>Spreadsheet ID</th><th>Operation Hours</th><th></th></tr></thead>
          <tbody>
            {% for d in docs %}
            <tr>
              <td>{{ d.label }}</td>
              <td>{{ d.spreadsheet_id }}</td>
              <td>
                <form method="post" action="/sheets/{{ d.spreadsheet_id }}/operation-hours" style="display:flex; gap:.5rem;">
                  <input type="number" step="0.5" min="0" name="hours" value="{{ d.operation_hours if d.operation_hours is not none else '' }}" placeholder="e.g. 12" style="margin-bottom:0; width:6rem;">
                  <button type="submit" class="btn">Save</button>
                </form>
              </td>
              <td><button type="button" class="btn" onclick="deleteDoc('{{ d.spreadsheet_id }}', this)">Delete</button></td>
            </tr>
            {% endfor %}
          </tbody>
        </table>
      </div>
    {% else %}
      <p class="ledger-empty">No docs configured yet.</p>
    {% endif %}

    <h2>Add a doc</h2>
    <div style="display:flex; gap:.5rem; margin-bottom:1rem;">
      <input type="text" id="spreadsheet-id" placeholder="Spreadsheet link or ID" aria-label="Spreadsheet link or ID" style="flex:1; margin-bottom:0;">
      <button type="button" id="load-tabs-btn" class="btn btn-primary" onclick="loadTabs()">Load tabs</button>
    </div>
    <div id="tabs"></div>
  </div>

  <script>
    function extractSpreadsheetId(value) {
      const match = value.match(/\/spreadsheets\/d\/([a-zA-Z0-9-_]+)/);
      return match ? match[1] : value;
    }

    async function deleteDoc(spreadsheetId, btn) {
      if (!confirm('Delete this doc?')) return;
      btn.disabled = true;
      btn.textContent = 'Deleting…';
      await fetch(`/sheets/${spreadsheetId}/delete`, { method: 'POST' });
      location.reload();
    }

    async function syncNow() {
      const btn = document.getElementById('sync-btn');
      const status = document.getElementById('sync-status');
      btn.disabled = true;
      status.style.display = 'block';
      status.textContent = 'Syncing…';
      try {
        const resp = await fetch('/api/sync', { method: 'POST' });
        if (!resp.ok) { status.textContent = 'Sync failed.'; return; }
        const data = await resp.json();
        const total = Object.values(data.new_tabs).reduce(
          (n, tabs) => n + (Array.isArray(tabs) ? tabs.length : 0), 0
        );
        status.textContent = total
          ? `Found ${total} new tab(s) — reload to see them.`
          : 'No new tabs found.';
      } finally {
        btn.disabled = false;
      }
    }

    async function loadTabs() {
      const spreadsheetId = extractSpreadsheetId(document.getElementById('spreadsheet-id').value.trim());
      if (!spreadsheetId) return;
      const btn = document.getElementById('load-tabs-btn');
      const container = document.getElementById('tabs');
      btn.disabled = true;
      container.innerHTML = '<p class="ledger-empty">Loading tabs…</p>';
      let resp;
      try {
        resp = await fetch('/api/sheets/tabs', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ spreadsheet_id: spreadsheetId }),
        });
      } finally {
        btn.disabled = false;
      }
      if (!resp.ok) { container.innerHTML = ''; alert('Could not load tabs — check the spreadsheet ID.'); return; }
      const data = await resp.json();
      container.innerHTML = '';
      data.tabs.forEach((tab) => {
        const a = document.createElement('a');
        a.href = `/sheets/${spreadsheetId}/configure?gid=${tab.gid}`;
        a.className = 'btn';
        a.style.display = 'block';
        a.style.marginBottom = '.5rem';
        a.textContent = tab.title;
        container.appendChild(a);
      });
    }
  </script>
</body>
</html>
