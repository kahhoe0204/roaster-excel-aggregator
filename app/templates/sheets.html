<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Configured docs</title>
  <link rel="icon" href="/static/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;700&family=IBM+Plex+Sans:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div class="top">
    <h1>Configured Docs</h1>
    <div>
      <a href="/" class="btn">Report</a>
      <a href="/logout" class="btn">Sign out</a>
    </div>
  </div>
  <hr class="roast-rule container">

  <div class="container">
    {% if docs %}
      <div class="table-wrap">
        <table class="ledger">
          <thead><tr><th>Label</th><th>Spreadsheet ID</th></tr></thead>
          <tbody>
            {% for d in docs %}
            <tr><td>{{ d.label }}</td><td>{{ d.spreadsheet_id }}</td></tr>
            {% endfor %}
          </tbody>
        </table>
      </div>
    {% else %}
      <p class="ledger-empty">No docs configured yet.</p>
    {% endif %}

    <h2>Add a doc</h2>
    <div style="display:flex; gap:.5rem; margin-bottom:1rem;">
      <input type="text" id="spreadsheet-id" placeholder="Spreadsheet ID" aria-label="Spreadsheet ID" style="flex:1; margin-bottom:0;">
      <button type="button" class="btn btn-primary" onclick="loadTabs()">Load tabs</button>
    </div>
    <div id="tabs"></div>
  </div>

  <script>
    async function loadTabs() {
      const spreadsheetId = document.getElementById('spreadsheet-id').value.trim();
      if (!spreadsheetId) return;
      const resp = await fetch('/api/sheets/tabs', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ spreadsheet_id: spreadsheetId }),
      });
      if (!resp.ok) { alert('Could not load tabs — check the spreadsheet ID.'); return; }
      const data = await resp.json();
      const container = document.getElementById('tabs');
      container.innerHTML = '';
      data.tabs.forEach((tab) => {
        const a = document.createElement('a');
        a.href = `/sheets/${spreadsheetId}/configure?gid=${tab.gid}`;
        a.className = 'btn';
        a.style.display = 'block';
        a.style.marginBottom = '.5rem';
        a.textContent = tab.title;
        container.appendChild(a);
      });
    }
  </script>
</body>
</html>
