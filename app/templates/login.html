<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in</title>
  <link rel="icon" href="/static/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;700&family=IBM+Plex+Sans:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div class="ledger-card">
    <h1 style="margin-top:0">Roster Ledger</h1>
    <hr class="roast-rule">
    {% if error %}<p class="error">{{ error }}</p>{% endif %}
    <form method="post" action="/login">
      <input name="username" type="text" placeholder="Username" aria-label="Username" autocomplete="username" required autofocus>
      <input name="password" type="password" placeholder="Password" aria-label="Password" autocomplete="current-password" required>
      <button type="submit" class="btn btn-primary">Sign in</button>
    </form>
  </div>
  <script>
    window.addEventListener('pageshow', function (e) {
      if (e.persisted) location.reload();
    });
  </script>
</body>
</html>
